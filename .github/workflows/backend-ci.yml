name: CI - Build Backend

on:
  pull_request:
    branches:
      - test
    paths:
      - backend/**

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.1
        env:
          POSTGRES_USER: sasicode
          POSTGRES_PASSWORD: password
          POSTGRES_DB: customer
        ports:
          - 5332:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set build number
        id: build-number
        run: echo "BUILD_NUMBER=$(date '+%d.%m.%Y.%H.%M.%S')" >> $GITHUB_OUTPUT

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Login into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and Run Unit/Integration Tests with Maven
        run: mvn -ntp -B verify

      - name: Notify Slack (Complete)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"✅ CI Integration completed for repo <https://github.com/${{ github.repository }}|${{ github.repository }}> on branch ${{ github.ref }}.\nStatus: SUCCESS\nBuild version: ${{steps.build-number.outputs.BUILD_NUMBER}}\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"
        env:
          VERSION: ${{ env.VERSION }}

      - name: Send Slack Message (Always Notify)
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"🛠️ GitHub Actions job completed for *${{ github.repository }}* on *${{ github.ref }}*.\nStatus: ${{ job.status }}\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"
